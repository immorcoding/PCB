# Placement of the STM32H743 + SDRAM board (stop 4), applied by
#   D:\KiCad\bin\python.exe -m Tools.KiCadDesignTools.placement.place stm32h743_sdram [--pcb <copy>] [--rot <SDRAM rotation>]
# Local frame (mm): origin at the board's top-left corner ([board] origin of board.toml), x right, y down. Rotations are
# KiCad footprint orientations in degrees (counter-clockwise seen from the top). A part is [x, y, rot] or
# [x, y, rot, "B"] (on the bottom). Re-running moves every listed part back to its position, redraws Edge.Cuts, the
# rule areas and their F.Cu no-pour keep-outs, and parks every part that is not listed in rows below the board.
# Stop 3 placed the two BGAs; stop 4 placed the rest around copper.sketch (LAY-1), keeping the SDRAM line-order sketch
# valid; the bottom decoupling positions came from decap_search.py (deleted, last in c38fa0d) and the BGA block plan
# (fan below).
# Fixed by the SPEC (section 8.1): the MCU is not rotated (A1 top-left); the SDRAM sits next to it; connectors on the
# board edge. Starting values (section 8.2): board 85 x 75 mm with R2 corners, M3 holes in the corners, SDRAM to the
# right of the MCU with about 5 mm between the package bodies.
# Moved here from place.py in stage 3C of the Tools/ consolidation (2026-11-24); the order of [parts] is the order the
# parts are placed in.

[outline]                        # Edge.Cuts: a rectangle with rounded corners
width = 85.0
height = 75.0
corner_r = 2.0

[holes]                          # M3 mounting holes, centres 4 mm from the board edges (positions in [parts])
refs = ["H801", "H802", "H803", "H804"]

[bodies]                         # package bodies (w, h) at rotation 0: rule areas and the part placed beside another
U201 = [10.0, 10.0]
U301 = [8.0, 13.0]               # rotation 0: 8 wide x 13 tall, A1 top-left; 90: 13 wide x 8 tall, A1 bottom-left

# Rule areas on every copper layer with every flag off: package body + margin on every side. No pour on F.Cu under
# the two BGAs (user 2026-11-22: "a BGA is not suited to taking power from copper pours; just track and via"): an
# F.Cu-only keep-out (no_pour) over the same rectangle that forbids zone fills and nothing else. Own names (not
# BGA_*: the rule file, busroute and escape_check read the BGA_* areas); the all-layer areas keep every flag off, so
# the L2 / L5 planes and the L6 fill under the BGAs stay.
[rule_areas]
margin = 1.0                     # approved 2026-11-16
areas = [
    { name = "BGA_MCU", ref = "U201", label = "MCU", no_pour = "NOPOUR_L1_MCU" },
    { name = "BGA_SDRAM", ref = "U301", label = "SDRAM", no_pour = "NOPOUR_L1_SDRAM" },
]

[pads]
mask_margin_zero = ["U201", "U301"]   # ball pads: solder-mask opening equal to the pad (approved exception)

[park]
skip = ["FID"]                   # reference prefixes never parked: the fiducials are finish's (stop 8, board-only)

# try/sgsps, the BGA block (SPEC 14 stop 3.3): the bottom decoupling under both BGAs sits where the BGA block plan put
# it (written by planning.bga_fan: each pad over a via of its net, every 3.3 V ball with a 100 nF close by); the parts the
# plan does not place keep the positions in [parts] (VCAP and VDDA parts when they are not in the plan).
[fan]
file = "bga_fan.json"
ref = "U201"                     # the package whose signal fan-out the routes files draw (routing.fan_plan)

# try/eth-west (user 2026-11-21: room for the MCU crystals, use the board edge). Four blocks moved as rigid bodies;
# [parts] keeps their stop-4 coordinates and the shift (dx, dy) is added to the parts listed here.
#   ETH   west until the RJ45's leftmost pad copper (LED pins) is 1.03 mm inside the left edge, so its body
#         overhangs the edge; then down to use the edge, the user LEDs and key making room below it
#   LCD   FPC body front on the bottom edge (it stood 3 mm in; J701 is listed on its own), its passives with it
#   QSPI  down by the same 3 mm, out of the way of the Ethernet block's east end (R514, FB501)
#   USER  LEDs and key below the Ethernet block
# Stop 7 reworked the Ethernet block inside itself and writes it in absolute coordinates; ETH stays as the record.
[shifts]
ETH = { d = [-4.1, 6.0], refs = [] }
LCD = { d = [0.0, 3.0], refs = ["R704", "R703", "R702", "R701", "R705", "C701", "C702", "R709"] }
QSPI = { d = [0.0, 3.0], refs = ["U401", "C401", "C402", "R404", "R401", "R402", "R403"] }
USER = { d = [0.0, 4.0], refs = ["D802", "R808", "D803", "R809", "SW801", "R810", "R811", "C806"] }

