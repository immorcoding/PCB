SDMMC1_D3 = "NE"
SD_CD = "NE"
CAN_STB = "NE"
SDMMC1_D0 = "NE"
SDMMC1_D1 = "NE"
FDCAN1_TX = "NE"
FDCAN1_RX = "NE"
RMII_TXD0 = "NWS"
RMII_TXD1 = "NWS"
RMII_TX_EN = "NWS"
PHY_NRST = "WS"
LCD_B6 = "NWSE"
LCD_B7 = "NWSE"
LCD_G3 = "NWSE"
LCD_G7 = "NWSE"
LCD_DISP = "NWSE"
LCD_BL_PWM = "NWSE"
