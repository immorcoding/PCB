# Board data of the demo board (STM32H743 + SDRAM, one byte lane, six layers), read by the build driver:
#   D:\KiCad\bin\python.exe -m Tools.KiCadDesignTools.build templates/demo_board <step>      (from the repository root)
# A new board starts as a copy of this folder: python -m Tools.KiCadDesignTools.build init NAME [--parent DIR].
# Coordinates are local mm (board-file mm - origin), x right, y down. Paths are relative to this folder. The SPEC is
# SPEC.md (its table 本板取值 is checked against these files by project.spec_check, the layout step's first command).

[board]
name = "demo_board"
title = "Demo board: STM32H743 + SDRAM, one byte lane"
rev = "A"
profile = "C"                    # docs/rule-profiles/C-bga-065.md
template = "C-bga-065"           # templates/C-bga-065: the profile's project file, rule file and six-layer board (RUL-1)
lib = "demo"                     # project symbol and footprint library
origin = [100.0, 100.0]
stackup = "JLC06161H-3313E"

[layers]
# top to bottom: L1 = F.Cu ... L6 = B.Cu (SPEC 6: signal / ground / signal / signal / power / signal)
roles = ["signal", "ground", "signal", "signal", "power", "signal"]
names = ["", "L2_GND", "L3_SIG", "L4_SIG", "L5_PWR", ""]

[project]
via_heights = [["L1", "L3"], ["L1", "L4"], ["L3", "L4"]]   # printed: the bus's layer changes

# Net classes after the template's Default, PWR and XTAL: the SDRAM bus (its length and via-count rules address it).
[netclasses]
SDRAM = { track_width = 0.1016, via_diameter = 0.45, via_drill = 0.2, priority = 10, clearance = 0.127 }

# Net-class patterns after the template's (PWR and XTAL by name): the pins.csv rows of these groups, then nets.
[netclass_patterns]
pins = "pins.csv"
nets = [["SDRAM", "FMC_SDCLK_R"],     # the SDRAM side of the clock's series resistor (not an MCU pin)
        ["PWR", "VCAP*"]]             # the core regulator's capacitors: short and wide (SPEC 5)

[netclass_patterns.groups]         # pins.csv group -> net class
SDRAM_DATA = "SDRAM"
SDRAM_ADDR = "SDRAM"
SDRAM_CLK = "SDRAM"
HSE = "XTAL"

[[footprints.derived]]             # the stock 90-ball BGA with 0.33 mm pads instead of 0.40 (SPEC 2.1)
lib = "Package_BGA"
footprint = "BGA-90_8.0x13.0mm_Layout2x3x15_P0.8mm"
name = "BGA-90_8.0x13.0mm_Layout2x3x15_P0.8mm_Pad0.33mm"
pad_size = [0.4, 0.33]
pads = 90

# The schematic (Tools.KiCadDesignTools.schematic): one page, sch/main.py.
[schematic]
review = false                   # kicad-happy's analyzer: left out on the demo (it is not part of the regression)
date = "2026-11-24"
power_symbols = ["GND", "+3V3"]
pages = [
    { name = "main", number = 0, title = "MCU, SDRAM byte lane, crystal, headers" },   # references without a page digit
]

[schematic.footprints]           # footprints by short name (sheet.FP)
C0402 = "Capacitor_SMD:C_0402_1005Metric"
C0603 = "Capacitor_SMD:C_0603_1608Metric"
C0805 = "Capacitor_SMD:C_0805_2012Metric"
C1206 = "Capacitor_SMD:C_1206_3216Metric"
R0402 = "Resistor_SMD:R_0402_1005Metric"
R0603 = "Resistor_SMD:R_0603_1608Metric"
R0805 = "Resistor_SMD:R_0805_2012Metric"
"TP_1.0" = "TestPoint:TestPoint_Pad_D1.0mm"
"TP_1.5" = "TestPoint:TestPoint_Pad_D1.5mm"

[schematic.pin_table]            # netlist check 2: the MCU's balls against the pin table
file = "pins.csv"
ref = "U1"
page = "main"

[schematic.swap]                 # netlist check 3: the SDRAM byte lane (SPEC 9); the page's ball_map() reads swap.csv
ref = "U2"
page = "main"
lanes = 1
data_net = "FMC_D"
mask_net = "FMC_NBL"

[layout]
decap_limit = 2.5                # mm, a 100 nF to the supply pin or ball it serves (LAY-2; SPEC 7.2)
allow_under = ["U1", "U2"]       # bottom parts under these (the decoupling under the BGAs, SPEC 6)
sketch = { routes = "routes_sdram.py", out = "out/sketch" }   # the bus on a copy of the placed board (RTE-13)

[layout.edges]                   # connector -> board edge it faces (LAY-6)
J1 = "L"
J2 = "B"

[[layout.escape]]                # escape_check (LAY-2) on the sketch copy: the two BGAs
refs = ["U1", "U2"]
json = "escape_bga.json"

# Measured trial checks of the layout step (Tools.KiCadDesignTools.placement.layout_probe; LAY-2 rails, LAY-3).
[probe]
mcu = "U1"
ground = "GND"
plane_net = "GND"                # L5 outside the +3V3 block is ground: no rail is "covered by the rest of the plane"

[probe.crystals]                 # crystal, load capacitors, MCU balls
HSE = { ref = "Y1", caps = ["C1", "C2"], balls = ["G1", "H1"] }

[probe.buses]                    # nets, far part, Manhattan limit (SPEC 9)
SDRAM = { to = "U2", limit = 30.0, nets = ["FMC_D0", "FMC_D1", "FMC_D2", "FMC_D3", "FMC_D4", "FMC_D5", "FMC_D6", "FMC_D7",
          "FMC_NBL0", "FMC_A0", "FMC_A1", "FMC_A2", "FMC_A3", "FMC_BA0"] }
UART = { to = "J2", nets = ["USART1_TX", "USART1_RX"] }

[copper]
sketch = "copper.sketch"
skip_areas = ["BGA_MCU", "BGA_SDRAM"]                  # cu_sketch measure leaves the BGA rule areas out
pour_check = ["cu-whole:L1_GND", "cu-whole:L6_GND"]    # pour_islands: every outer ground piece holds a via (PWR-6)

# Plane slots (Tools.KiCadDesignTools.copper.plane_slots: antipad chains, cut-off vias; finishing.pour: return paths).
[copper.slots]
windows = { BOARD = [-1, -1, 41, 31] }
ref_layers = { L2 = ["L1", "L3"], L5 = ["L4", "L6"] }   # plane -> signal layers whose return current runs on it
report = 2.0                     # slots longer than this are listed (no limit, SPEC 7.2)
blocks = {}                      # no BGA block of its own on the power plane (one +3V3 block under both)
part_b = "power_bga_sites.json"  # the BGA power group's vias (relative to the out folder)

# The copper-class nets (SPEC 5): their connectivity in the route table.
[copper.table]
nets = ["GND", "+3V3"]

[power]
ground = "GND"                   # never routed: a via at each pad
bus_prefix = "FMC_"              # nets of the bus group: the BGA power group's obstacles

[bga.U1]                         # the MCU: its supply net with a block on the power plane
supply = "+3V3"

[bga.U2]                         # the SDRAM
supply = "+3V3"

# The bus's nets for the length tools (planning.measure, routing.tune_sites, analysis.route_table): the byte lane from
# [schematic.swap], the clock's pieces summed across R1, the address lines.
[tune_sites]
layers = ["L1", "L3", "L4"]
clock = ["FMC_SDCLK", "FMC_SDCLK_R"]
addr = ["FMC_A0", "FMC_A1", "FMC_A2", "FMC_A3", "FMC_BA0"]
area_prefix = "BGA_"
box = [0.3, 0.3, 39.7, 29.7]     # the board (40 x 30) less 0.3 mm

[length]
start_refs = ["U1", "R1"]        # a net is traced from its pad on the first of these parts
window_rule = "sdram_addr_window"

[route]
orphans = true                   # copper no group claims is removed and listed (orphans.txt)

# Groups in build order. env: the busroute build's environment; {board} = the board file, {out} = the step's out folder.
[[route.group]]
name = "sdram"
file = "routes_sdram.py"

[[route.group]]
name = "power_bga"
file = "routes_power_bga.py"
env = { POWER_BGA_LOG = "{out}/power_bga_sites.txt" }

[[route.group]]
name = "local"
file = "routes_local.py"
in_report = true

[[route.escape]]
refs = ["U1", "U2"]
json = "escape_bga.json"

[[route.slots]]                  # plane slots over the whole board
name = "BOARD"
window = [-1, -1, 41, 31]
part_b = "power_bga_sites.json"
tail = 8

# The route step's table (Tools.KiCadDesignTools.analysis.route_table): the bus group's part, then one row per routes file.
[route.table]
bus = "sdram"                    # the group of the first part (lengths, serpentines, vias, order)
label = "SDRAM"
title = "== 走线：SDRAM 组写入真板，BGA 电源组和局部组在它之后，KiCad 填充后量 =="
part_title = "== SDRAM 组（同一块板、同一次填充和 DRC）=="
lane_rule = "sdram_lane"         # the byte lane's skew rule <lane_rule>0 of the rule file
straight = 2.5                   # data / mask straights at least this long are serpentine candidates (straights.json)
slot_mark = 3.0                  # plane slots longer than this are named (report only)
slot_list = 2.5                  # plane slots longer than this are listed one by one (report only, RTE-5: no limit)
sites = "power_bga_sites.json"   # the BGA power group's via sites
place_refs = ["U1", "U2"]        # their pin lines of place_check.txt go into the table

[route.table.escape]             # escape_check of the route step against the layout step's
json = "escape_bga.json"
before = "out/layout/escape_bga.json"
skip = ["FMC_", "+", "GND", "VCAP"]   # the bus and the supplies: signal balls are the rest
title = "escape_check（两颗 BGA），非总线、非电源的信号球，现在对布局一步："

[[route.views]]
layers = ["L1", "L3", "L4", "L6"]
scale = 40
name = "bus"

[[route.views]]
layers = ["L2", "L5"]
scale = 30
name = "planes"

[copper_view]
layers = ["L1", "L2", "L5", "L6"]
label_strip = "FMC_"

[copper_view.colours]
GND = [150, 170, 150]
"+3V3" = [205, 220, 120]

# The finish step (Tools.KiCadDesignTools.finishing.finish); the silkscreen's items are in silk.toml.
[finish]
rest = 20                        # seconds of pause after each refill, DRC and render
clean_passes = 2
render = { sides = ["top", "bottom"], width = 1200, height = 900, quality = "basic", timeout = 180 }
pour_layers = ["L1", "L3", "L4", "L6"]

# Fiducials (JLCPCB: 1 mm copper, 2 mm mask opening, keep-out edge >= 3.35 mm from the board edge): three on the top.
[finish.fiducials]
footprint = "Fiducial:Fiducial_1mm_Mask2mm"
keepout_r = 1.5
edge_min = 3.35
top = { FID1 = [4.9, 4.9], FID2 = [35.1, 4.9], FID3 = [5.4, 25.1] }   # top left, top right, bottom left (clear of J1)

[finish.pour]
layers = ["L3", "L4"]            # the inner signal layers poured with ground
clearance = 0.2
min_width = 0.3
island_min = 2.0
thermal = 0.254
tune_margin = 0.5
sliver_w = 0.6
sliver_len = 1.0
neck_len = 3.0
gap_reach = 0.5
report_min_width = { L1 = 0.3, L2 = 0.2, L3 = 0.3, L4 = 0.3, L5 = 0.2, L6 = 0.3 }

[finish.stitch]
via = { size = 0.45, drill = 0.2 }
gnd_in = 0.05
outer = 0.2
lane = 0.25
pad = 0.25
crt = 0.1
edge = 0.8
plane_web = 0.6
via_gap = 0.3
gnd_spacing = 1.2
d_open = 4.0
d_dense = 3.0
d_rim = 3.5
edge_band = 4.0
min_gain = 6.0
piece_min = 1.5
long = 5.0
thin = 2.5
end_r = 2.5
dense = {}
feed_keep = {}
xtal_refs = ["Y1", "C1", "C2"]
xtal_grow = 0.6

[finish.teardrops]
skip_boxes = [[8.0, 8.0, 20.0, 20.0], [24.0, 8.5, 34.0, 23.5]]   # x0 y0 x1 y1: the BGA rule areas

[finish.view]                    # close-ups of the top silkscreen, x0 y0 x1 y1
close = { headers = [0.0, 18.0, 40.0, 30.0] }
